<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Browser Agent</title>
  <style>
    :root { --ink:#17212b; --muted:#62707c; --paper:#f6f3ed; --panel:#fffdf8; --line:#d8d5cc; --accent:#e45f3c; --accent-dark:#b9442a; --teal:#176b69; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font-family:Georgia, 'Times New Roman', serif; background:var(--paper); }
    body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.35; background-image:linear-gradient(rgba(23,33,43,.035) 1px, transparent 1px),linear-gradient(90deg,rgba(23,33,43,.035) 1px, transparent 1px); background-size:28px 28px; }
    main { position:relative; max-width:1120px; margin:0 auto; padding:42px 22px 56px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:24px; padding-bottom:28px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:clamp(2.3rem,6vw,5.5rem); line-height:.9; letter-spacing:0; max-width:650px; }
    .kicker { margin:0 0 12px; color:var(--accent-dark); font:700 .78rem/1.2 Arial,sans-serif; letter-spacing:0; text-transform:uppercase; }
    .health { display:flex; align-items:center; gap:8px; color:var(--muted); font:600 .8rem Arial,sans-serif; white-space:nowrap; }
    .dot { width:9px; height:9px; border-radius:50%; background:#d5a326; }
    .dot.ready { background:#2b9a70; }
    .workspace { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr); gap:20px; margin-top:24px; }
    .panel { background:var(--panel); border:1px solid var(--line); padding:22px; box-shadow:5px 5px 0 rgba(23,33,43,.08); }
    label, .label { display:block; margin-bottom:9px; color:var(--muted); font:700 .75rem Arial,sans-serif; letter-spacing:0; text-transform:uppercase; }
    textarea { display:block; width:100%; min-height:180px; resize:vertical; border:1px solid var(--line); border-radius:4px; padding:16px; color:var(--ink); background:#fff; font:1.15rem/1.45 Georgia,serif; outline:none; }
    textarea:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(23,107,105,.12); }
    .controls { display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:18px; }
    .switch { display:flex; align-items:center; gap:8px; color:var(--ink); font:600 .9rem Arial,sans-serif; text-transform:none; }
    input[type=checkbox] { width:17px; height:17px; accent-color:var(--teal); }
    input[type=number] { width:72px; padding:8px; border:1px solid var(--line); border-radius:3px; font:600 .9rem Arial,sans-serif; }
    button { border:0; border-radius:3px; padding:12px 18px; color:#fff; background:var(--accent); cursor:pointer; font:700 .82rem Arial,sans-serif; letter-spacing:0; text-transform:uppercase; }
    button:hover { background:var(--accent-dark); }
    button:disabled { cursor:wait; opacity:.55; }
    .secondary { color:var(--ink); background:#e8e4da; }
    .secondary:hover { background:#d9d4c8; }
    .result-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    h2 { margin:0; font-size:1.5rem; }
    .badge { padding:6px 9px; border-radius:20px; color:var(--teal); background:#dcecea; font:700 .7rem Arial,sans-serif; text-transform:uppercase; }
    pre { margin:0; min-height:292px; max-height:520px; overflow:auto; padding:15px; border-left:3px solid var(--teal); background:#f0f1ec; color:#26343b; white-space:pre-wrap; overflow-wrap:anywhere; font: .78rem/1.5 Consolas,monospace; }
    .notice { display:none; margin-top:14px; padding:12px 14px; color:#70351e; background:#f9dfd3; border-left:3px solid var(--accent); font: .88rem/1.4 Arial,sans-serif; }
    .notice.show { display:block; }
    .metric-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:15px; }
    .metric { padding:13px; background:#f1ede3; border-top:2px solid var(--teal); min-width:0; }
    .metric strong { display:block; font-size:1.5rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .metric span { color:var(--muted); font: .7rem Arial,sans-serif; text-transform:uppercase; }
    footer { margin-top:22px; color:var(--muted); font: .75rem Arial,sans-serif; }
    @media (max-width:760px) { main { padding:26px 14px 40px; } header { display:block; } .health { margin-top:20px; } .workspace { grid-template-columns:1fr; } .panel { padding:17px; } .metric-grid { grid-template-columns:1fr 1fr 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="kicker">Browser automation console</p><h1>AI Browser<br>Agent</h1></div>
      <div class="health"><span id="healthDot" class="dot"></span><span id="healthText">Checking server...</span></div>
    </header>
    <section class="workspace">
      <div class="panel">
        <label for="query">Task</label>
        <textarea id="query" placeholder="Open Wikipedia and search for Artificial Intelligence"></textarea>
        <div class="controls">
          <label class="switch"><input id="vision" type="checkbox"> Vision</label>
          <label class="switch"><input id="headless" type="checkbox"> Headless</label>
          <label class="switch" for="steps">Max steps <input id="steps" type="number" value="10" min="1" max="30"></label>
          <button id="runButton" onclick="runAgent()">Run task</button>
          <button class="secondary" onclick="loadMetrics()">Metrics</button>
        </div>
        <div id="notice" class="notice"></div>
      </div>
      <div class="panel">
        <div class="result-head"><h2>Result</h2><span id="status" class="badge">Idle</span></div>
        <pre id="output">Enter a task and select Run task.</pre>
        <div class="metric-grid"><div class="metric"><strong id="stepCount">0</strong><span>Steps</span></div><div class="metric"><strong id="resultStatus">-</strong><span>Status</span></div><div class="metric"><strong id="resultUrl">-</strong><span>Final URL</span></div></div>
      </div>
    </section>
    <footer>Keep the agent browser open while a task is running. It closes automatically when the task finishes.</footer>
  </main>
  <script>
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const notice = document.getElementById('notice');
    function show(data) {
      output.textContent = JSON.stringify(data, null, 2);
      status.textContent = data.status || 'Unknown';
      document.getElementById('stepCount').textContent = (data.steps || []).length;
      document.getElementById('resultStatus').textContent = data.status || '-';
      try { document.getElementById('resultUrl').textContent = data.final_url ? new URL(data.final_url).hostname : '-'; } catch (_) { document.getElementById('resultUrl').textContent = '-'; }
      const message = String(data.message || '');
      notice.textContent = message.includes('402') || message.toLowerCase().includes('credits')
        ? 'OpenRouter credits are unavailable for this request. Disable Vision, wait for active requests to finish, use an available free model, or add credits.' : '';
      notice.classList.toggle('show', Boolean(notice.textContent));
    }
    async function runAgent() {
      const button = document.getElementById('runButton');
      const query = document.getElementById('query').value.trim();
      if (query.length < 2) { notice.textContent = 'Enter a task first.'; notice.classList.add('show'); return; }
      button.disabled = true; status.textContent = 'Running'; output.textContent = 'Running...'; notice.classList.remove('show');
      try {
        const response = await fetch('/command', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query, use_vision:document.getElementById('vision').checked, headless:document.getElementById('headless').checked, max_steps:Number(document.getElementById('steps').value)}) });
        show(await response.json());
      } catch (error) { show({status:'error', message:'Could not reach the server: ' + error.message, steps:[]}); }
      finally { button.disabled = false; }
    }
    async function loadMetrics() { try { show(await (await fetch('/metrics')).json()); } catch (error) { show({status:'error', message:error.message, steps:[]}); } }
    async function checkHealth() { try { const data = await (await fetch('/health')).json(); document.getElementById('healthDot').classList.add('ready'); document.getElementById('healthText').textContent = data.status === 'healthy' ? 'Server ready' : 'Server issue'; } catch (_) { document.getElementById('healthText').textContent = 'Server unavailable'; } }
    checkHealth();
  </script>
</body>
</html>
